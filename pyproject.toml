[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-conversation-search"
version = "0.1.0"
description = "Search conversations across local AI agents, with raw source pointers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "zstandard>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
acs = "agent_conversation_search.cli:main"

[tool.setuptools.packages.find]
include = ["agent_conversation_search*"]